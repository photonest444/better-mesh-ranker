name: Android

# Сборка APK: JVM-тесты ядра, debug-сборка для проверки и release-сборка (без подписи)
# По тегу v* артефакт прикрепляется к релизу.

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Gradle (кеш и wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Права на gradlew
        run: chmod +x android/gradlew

      - name: JVM-тесты ядра (без эмулятора)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Release APK (без подписи, если нет keystore.properties)
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Отчёты тестов при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/**
          if-no-files-found: ignore

      - name: Загрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: mesh-ranker-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Публикация в релиз (только по тегу)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
