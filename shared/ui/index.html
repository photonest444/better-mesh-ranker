<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesh Ranker — рейтинг класса МЭШ</title>
  <meta name="description" content="Рейтинг класса school.mos.ru: места, средние баллы, оценки, домашние задания и расписание.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Модальные окна -->
  <div id="modal-root"></div>
  <!-- Всплывающие уведомления -->
  <div id="toasts" class="toasts"></div>
  <!-- Экран входа -->
  <div id="login-root" class="login-root"></div>

  <!-- Каркас приложения -->
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">МЭШ</span>
        <div class="brand-text">
          <div class="brand-title">Mesh Ranker</div>
          <div class="brand-sub muted small">рейтинг класса</div>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div id="sidebar-meta" class="muted small"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div id="topbar-left" class="topbar-left"></div>
        <div id="topbar-right" class="topbar-right"></div>
      </header>
      <div id="view-host" class="view-host"></div>
    </main>
  </div>

  <!-- Ядро (единый источник правды для Electron, Android и web) -->
  <script src="../core/lib/util.js"></script>
  <script src="../core/lib/stats.js"></script>
  <script src="../core/lib/format.js"></script>
  <script src="../core/lib/table.js"></script>
  <!-- Аналитика: прогноз, «что если», дедлайны, динамика -->
  <script src="../core/lib/insights.js"></script>
  <script src="../core/mesh-core.js"></script>
  <!-- Мост к нативному ядру на Rust + ускоритель расчётов (в браузере — заглушка) -->
  <script src="../core/native.js"></script>
  <script src="../core/accelerate.js"></script>
  <script src="../core/bench-compare.js"></script>

  <!-- UI-кит и платформенный слой -->
  <script src="components/ui.js"></script>
  <script src="components/table.js"></script>
  <script src="components/palette.js"></script>
  <script src="platform.js"></script>
  <script src="components/login.js"></script>

  <!-- Вкладки -->
  <script src="views/ranking.js"></script>
  <script src="views/subjects.js"></script>
  <script src="views/marks.js"></script>
  <script src="views/homeworks.js"></script>
  <script src="views/schedule.js"></script>
  <script src="views/insights.js"></script>
  <script src="views/profile.js"></script>
  <script src="views/settings.js"></script>

  <!-- Оболочка запускается последней -->
  <script src="app.js"></script>

  <noscript>
    <div class="noscript">Для работы интерфейса нужно включить JavaScript.</div>
  </noscript>
</body>
</html>
